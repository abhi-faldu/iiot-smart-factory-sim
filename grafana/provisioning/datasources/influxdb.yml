apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: factory
      defaultBucket: sensors
    secureJsonData:
      token: factory-token
    isDefault: true
    editable: false
